[project]
name = "flowcode-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "exa-py>=2.28.0",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import the agent package
testpaths = ["tests"]
